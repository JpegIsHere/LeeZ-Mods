name: Publish LeezGrowLights dev12

on:
  push:
    branches:
      - dev/colour-system

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-dev12]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package source
        uses: actions/checkout@v4

      - name: Download validated V3.1 DLL artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh run download 31295389819 \
            --name LeezGrowLights-v0.7.0-dev9-v31 \
            --dir downloaded
          test -f downloaded/LeezGrowLights.dll

      - name: Assemble full drop-in mod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/LeezGrowLights
          cp LeezGrowLights/ModInfo.xml dist/LeezGrowLights/
          cp -R LeezGrowLights/Config dist/LeezGrowLights/Config
          cp downloaded/LeezGrowLights.dll dist/LeezGrowLights/
          if [ -f downloaded/LeezGrowLights.pdb ]; then
            cp downloaded/LeezGrowLights.pdb dist/LeezGrowLights/
          fi
          cd dist
          zip -r LeezGrowLights-v0.7.0.2-dev12-v31.zip LeezGrowLights >/dev/null
          sha256sum LeezGrowLights-v0.7.0.2-dev12-v31.zip LeezGrowLights/LeezGrowLights.dll

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Official LeeZ Grow Lights v0.7.0.2 / dev12 build for 7 Days to Die V3.1.0 b14.

          Fix in this release:
          - Corrected the Brightness radial-menu label so it shows the next level that clicking will apply rather than the current level.
          - Menu sequence is now Dim -> Normal, Normal -> Bright, Bright -> Very Bright, Very Bright -> Maximum, Maximum -> Dim.

          Retained from the validated dev11 release:
          - Direct-wired grow lights draw 0 W while switched OFF and restore their configured draw when switched ON.
          - OFF-state power remains correct across save/reload initialization.
          - Color and Brightness radial-menu icons remain visible.
          - Existing colour/brightness persistence, visual intensity, crop coverage and tier behaviour are unchanged.

          The release DLL was produced by successful V3.1 CI run 31295389819 from validated source commit 1449cba3cb663ab0ae3ea78458e6e02e54b69f13.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create leezgrowlights-v0.7.0.2-v31 \
            --target 1449cba3cb663ab0ae3ea78458e6e02e54b69f13 \
            --title 'LeezGrowLights v0.7.0.2 - V3.1' \
            --notes-file release-notes.md \
            dist/LeezGrowLights-v0.7.0.2-dev12-v31.zip \
            downloaded/LeezGrowLights.dll
