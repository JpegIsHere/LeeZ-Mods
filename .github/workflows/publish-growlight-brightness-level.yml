name: Publish Growlight_BrightnessLevel

on:
  push:
    branches:
      - dev/colour-system
    paths:
      - '.github/workflows/publish-growlight-brightness-level.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated dev10 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-artifact
          gh run download 31256329055 \
            --repo JpegIsHere/LeeZ-Mods \
            --name LeezGrowLights-v0.7.0-dev9-v31 \
            --dir release-artifact

      - name: Prepare release assets
        run: |
          cp release-artifact/LeezGrowLights.dll Growlight_BrightnessLevel.dll
          cd release-artifact
          zip -r ../Growlight_BrightnessLevel-v0.7.0-dev10-v31.zip .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create growlight-brightness-dev10 \
            --repo JpegIsHere/LeeZ-Mods \
            --target 3fd1b16127eacd7313c79b375d6a11c237f366e6 \
            --title 'Growlight_BrightnessLevel' \
            --notes 'Validated LeezGrowLights brightness-level build for 7 Days to Die V3.1 b14. Runtime: v0.7.0-dev10. Live testing confirmed colour/brightness independence, persistence, power toggling, save/reload, tier behaviour, and stable LightLOD-controlled visual intensity.' \
            Growlight_BrightnessLevel.dll \
            Growlight_BrightnessLevel-v0.7.0-dev10-v31.zip
