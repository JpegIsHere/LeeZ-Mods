name: Publish LeezGrowLights dev11

on:
  push:
    branches:
      - dev/colour-system

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-dev11]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official source
        uses: actions/checkout@v4

      - name: Find latest successful V3.1 DLL build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list \
            --workflow build-leezgrowlights-v31.yml \
            --branch dev/colour-system \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo 'No successful V3.1 DLL build is available.' >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using successful DLL build run $run_id"

      - name: Download validated DLL artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh run download "${{ steps.build.outputs.run_id }}" \
            --name LeezGrowLights-v0.7.0-dev9-v31 \
            --dir downloaded
          test -f downloaded/LeezGrowLights.dll

      - name: Assemble official V3.1 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/LeezGrowLights
          cp LeezGrowLights/ModInfo.xml dist/LeezGrowLights/
          cp -R LeezGrowLights/Config dist/LeezGrowLights/Config
          cp downloaded/LeezGrowLights.dll dist/LeezGrowLights/
          cd dist
          zip -r LeezGrowLights-v0.7.0.1-dev11-v31.zip LeezGrowLights >/dev/null
          sha256sum LeezGrowLights-v0.7.0.1-dev11-v31.zip LeezGrowLights/LeezGrowLights.dll

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Official LeeZ Grow Lights dev11 build for 7 Days to Die V3.1.0 b14.

          Validated fixes in this release:
          - Directly wired grow lights now draw 0 W while switched OFF and restore their configured 10 W draw when switched ON.
          - OFF-state power remains correct after save/reload initialization.
          - The Color radial-menu command now has a visible built-in icon.
          - The Brightness radial-menu command now has a visible built-in icon.
          - Existing dev10 colour and brightness cycling, persistence, visual intensity, tier behaviour and crop-light functionality remain intact.

          These fixes were live-tested in game before promotion to the official build.

          Known limitation: remote-client colour/brightness authoring and full dedicated-server visual synchronization remain future multiplayer work.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create leezgrowlights-v0.7.0.1-v31 \
            --target "$GITHUB_SHA" \
            --title 'LeezGrowLights v0.7.0.1 - V3.1' \
            --notes-file release-notes.md \
            dist/LeezGrowLights-v0.7.0.1-dev11-v31.zip \
            downloaded/LeezGrowLights.dll
