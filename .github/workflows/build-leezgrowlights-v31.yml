name: Build LeezGrowLights V3.1 DLL

on:
  push:
    branches:
      - dev/colour-system
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install SteamCMD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $steamDir = Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steamDir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $steamDir -Force
          $steamCmd = Join-Path $steamDir 'steamcmd.exe'

          $oldNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          & $steamCmd +quit
          Write-Host "Initial SteamCMD bootstrap exit code: $LASTEXITCODE"
          Start-Sleep -Seconds 4
          & $steamCmd +quit
          Write-Host "Second SteamCMD bootstrap exit code: $LASTEXITCODE"
          $PSNativeCommandUseErrorActionPreference = $oldNativePreference

          if (-not (Test-Path $steamCmd)) { throw 'SteamCMD executable disappeared after self-update.' }
          "STEAMCMD=$steamCmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install 7 Days to Die Dedicated Server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gameDir = Join-Path $env:RUNNER_TEMP '7dtd-server'
          $oldNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false

          $exitCode = 1
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "SteamCMD app_update attempt $attempt"
            & $env:STEAMCMD +force_install_dir $gameDir +login anonymous +app_update 294420 validate +quit
            $exitCode = $LASTEXITCODE
            Write-Host "SteamCMD app_update exit code: $exitCode"
            if ($exitCode -eq 0 -and (Test-Path $gameDir)) { break }
            Start-Sleep -Seconds 5
          }

          $PSNativeCommandUseErrorActionPreference = $oldNativePreference
          if ($exitCode -ne 0) { throw "SteamCMD failed with exit code $exitCode" }
          "GAME_DIR=$gameDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate V3.1 build references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $managedCandidates = @(
            (Join-Path $env:GAME_DIR '7DaysToDieServer_Data\Managed'),
            (Join-Path $env:GAME_DIR '7DaysToDie_Data\Managed')
          )
          $managed = $managedCandidates | Where-Object { Test-Path (Join-Path $_ 'Assembly-CSharp.dll') } | Select-Object -First 1
          if (-not $managed) {
            Get-ChildItem $env:GAME_DIR -Recurse -Filter Assembly-CSharp.dll | Select-Object -ExpandProperty FullName
            throw 'Could not locate Assembly-CSharp.dll in the dedicated-server install.'
          }

          $harmony = Get-ChildItem $env:GAME_DIR -Recurse -Filter 0Harmony.dll | Select-Object -First 1 -ExpandProperty FullName
          if (-not $harmony) { throw 'Could not locate 0Harmony.dll in the dedicated-server install.' }

          Write-Host "Managed references: $managed"
          Write-Host "Harmony reference: $harmony"
          "GAME_MANAGED=$managed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HARMONY_DLL=$harmony" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Probe V3.1 light intensity writers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cecil = Get-ChildItem $env:GAME_DIR -Recurse -Filter Mono.Cecil.dll | Select-Object -First 1 -ExpandProperty FullName
          if (-not $cecil) { throw 'Mono.Cecil.dll not found in server install.' }
          Add-Type -Path $cecil

          $assemblyPath = Join-Path $env:GAME_MANAGED 'Assembly-CSharp.dll'
          $module = [Mono.Cecil.ModuleDefinition]::ReadModule($assemblyPath)

          function Get-AllTypes([Mono.Cecil.TypeDefinition]$type) {
            $type
            foreach ($nested in $type.NestedTypes) { Get-AllTypes $nested }
          }

          Write-Host '=== Methods writing UnityEngine.Light.intensity ==='
          $matches = @()
          foreach ($root in $module.Types) {
            foreach ($type in (Get-AllTypes $root)) {
              foreach ($method in $type.Methods) {
                if (-not $method.HasBody) { continue }
                $instructions = $method.Body.Instructions
                for ($i = 0; $i -lt $instructions.Count; $i++) {
                  $operand = $instructions[$i].Operand
                  if ($null -eq $operand) { continue }
                  $text = $operand.ToString()
                  if ($text -notmatch 'UnityEngine\.Light::set_intensity') { continue }

                  $matches += $method.FullName
                  Write-Host ("WRITER {0}" -f $method.FullName)
                  $start = [Math]::Max(0, $i - 8)
                  $end = [Math]::Min($instructions.Count - 1, $i + 5)
                  for ($j = $start; $j -le $end; $j++) {
                    Write-Host ("  IL_{0:X4}: {1}" -f $instructions[$j].Offset, $instructions[$j].ToString())
                  }
                }
              }
            }
          }
          Write-Host ("Intensity writer count: {0}" -f ($matches | Select-Object -Unique).Count)

          Write-Host '=== BlockPoweredLight relevant IL ==='
          $bpl = $module.Types | Where-Object { $_.Name -eq 'BlockPoweredLight' } | Select-Object -First 1
          if ($bpl) {
            foreach ($method in ($bpl.Methods | Where-Object { $_.Name -in @('updateLightState','OnBlockEntityTransformAfterActivated','OnBlockActivated') })) {
              Write-Host ("METHOD {0}" -f $method.FullName)
              if (-not $method.HasBody) { Write-Host '  <no body>'; continue }
              foreach ($instruction in $method.Body.Instructions) {
                Write-Host ("  IL_{0:X4}: {1}" -f $instruction.Offset, $instruction.ToString())
              }
            }
          }

      - name: Probe V3.1 block metadata capacity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $managed = $env:GAME_MANAGED
          $resolver = [ResolveEventHandler]{
            param($sender, $eventArgs)
            $simple = ([Reflection.AssemblyName]$eventArgs.Name).Name + '.dll'
            $candidate = Join-Path $managed $simple
            if (Test-Path $candidate) { return [Reflection.Assembly]::LoadFrom($candidate) }
            return $null
          }
          [AppDomain]::CurrentDomain.add_AssemblyResolve($resolver)
          try {
            $asm = [Reflection.Assembly]::LoadFrom((Join-Path $managed 'Assembly-CSharp.dll'))
            $flags = [Reflection.BindingFlags]'Instance,Static,Public,NonPublic'
            $blockValue = $asm.GetType('BlockValue', $true)

            Write-Host '=== BlockValue bit constants ==='
            foreach ($name in @(
              'Metadata1Mask','Metadata1Shift','Metadata2Mask','Metadata2Shift',
              'Metadata3Mask','Metadata3Shift','Metadata3Max','Metadata12Max','MetadataMax',
              'RotationMask','RotationShift','RotationMax','RotationMeta3Mask','RotationMeta3Max')) {
              $field = $blockValue.GetField($name, $flags)
              if (-not $field) { Write-Host "$name=<missing>"; continue }
              $value = $field.GetValue($null)
              if ($value -is [uint32]) { Write-Host ("{0}={1} (0x{1:X8})" -f $name, $value) }
              else { Write-Host ("{0}={1}" -f $name, $value) }
            }

            $meta = $blockValue.GetProperty('meta', $flags)
            $meta2 = $blockValue.GetProperty('meta2', $flags)
            $meta3 = $blockValue.GetProperty('meta3', $flags)
            $rotation = $blockValue.GetProperty('rotation', $flags)
            $rotationAndMeta3 = $blockValue.GetProperty('rotationAndMeta3', $flags)
            $raw = $blockValue.GetField('rawData', $flags)

            Write-Host '=== meta2 assignment probe ==='
            foreach ($test in @(15,16,19,24,25,30,31,255)) {
              $boxed = [Activator]::CreateInstance($blockValue)
              $meta2.SetValue($boxed, [byte]$test, $null)
              Write-Host ("META2 input={0} read={1} raw=0x{2:X8}" -f $test, $meta2.GetValue($boxed,$null), [uint32]$raw.GetValue($boxed))
            }

            Write-Host '=== rotation/meta3 assignment probe ==='
            foreach ($baseRotation in @(0,1,5,10,15,20,31)) {
              foreach ($combined in @(0,1,7,15,31,32,63,64,127,255)) {
                $boxed = [Activator]::CreateInstance($blockValue)
                $rotation.SetValue($boxed, [byte]$baseRotation, $null)
                $beforeRaw = [uint32]$raw.GetValue($boxed)
                $rotationAndMeta3.SetValue($boxed, [byte]$combined, $null)
                Write-Host ("ROT base={0} combinedIn={1} => rotation={2} meta3={3} meta={4} meta2={5} rawBefore=0x{6:X8} rawAfter=0x{7:X8}" -f
                  $baseRotation, $combined,
                  $rotation.GetValue($boxed,$null), $meta3.GetValue($boxed,$null),
                  $meta.GetValue($boxed,$null), $meta2.GetValue($boxed,$null),
                  $beforeRaw, [uint32]$raw.GetValue($boxed))
              }
            }
          }
          finally {
            [AppDomain]::CurrentDomain.remove_AssemblyResolve($resolver)
          }

      - name: Build Release DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild 'LeezGrowLights\Source\LeezGrowLights.csproj' /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:GameManagedPath="$env:GAME_MANAGED" /p:HarmonyPath="$env:HARMONY_DLL" /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'LeezGrowLights\LeezGrowLights.dll')) { throw 'Expected LeezGrowLights.dll was not produced.' }

      - name: Stage test DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item 'LeezGrowLights\LeezGrowLights.dll' 'artifact\LeezGrowLights.dll'
          if (Test-Path 'LeezGrowLights\LeezGrowLights.pdb') {
            Copy-Item 'LeezGrowLights\LeezGrowLights.pdb' 'artifact\LeezGrowLights.pdb'
          }
          Get-FileHash 'artifact\LeezGrowLights.dll' -Algorithm SHA256 | Format-List

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: LeezGrowLights-v0.7.0-dev9-v31
          path: artifact/
          if-no-files-found: error
          retention-days: 14
